<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>New Gen UI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@100;300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  /* ===== TYPOGRAPHY: one source for the whole UI (HTML and 3D labels) =====
     Scale: base 16px, ratio 1.2. Line height = 1.5 x size. */
  :root {
    --bg: #ffffff; --fg: #000000;
    --font: 'IBM Plex Mono', ui-monospace, monospace;

    --fs-9xl: 99.07px; --lh-9xl: 148.6px;
    --fs-8xl: 82.56px; --lh-8xl: 123.83px;
    --fs-7xl: 68.8px;  --lh-7xl: 103.2px;
    --fs-6xl: 57.33px; --lh-6xl: 86px;
    --fs-5xl: 47.78px; --lh-5xl: 71.66px;
    --fs-4xl: 39.81px; --lh-4xl: 59.72px;
    --fs-3xl: 33.18px; --lh-3xl: 49.77px;
    --fs-2xl: 27.65px; --lh-2xl: 41.47px;
    --fs-xl:  23.04px; --lh-xl:  34.56px;
    --fs-lg:  19.2px;  --lh-lg:  28.8px;
    --fs-base: 16px;   --lh-base: 24px;
    --fs-sm:  13.33px; --lh-sm:  20px;
    --fs-xs:  11.11px; --lh-xs:  16.67px;

    --fw-thin: 100; --fw-light: 300; --fw-normal: 400; --fw-medium: 500;
    --fw-semibold: 600; --fw-bold: 700;
    --fw-black: 700; /* IBM Plex Mono has no 900, so Black uses its heaviest (700) */

    /* Headings: which scale size and weight each level uses */
    --h1-size: 4xl;  --h1-weight: semibold;
    --h2-size: 3xl;  --h2-weight: semibold;
    --h3-size: 2xl;  --h3-weight: semibold;
    --h4-size: xl;   --h4-weight: semibold;
    --h5-size: lg;   --h5-weight: medium;
    --h6-size: base; --h6-weight: medium;
  }
  h1 { font-size: var(--fs-4xl); line-height: var(--lh-4xl); font-weight: var(--fw-semibold); }
  h2 { font-size: var(--fs-3xl); line-height: var(--lh-3xl); font-weight: var(--fw-semibold); }
  h3 { font-size: var(--fs-2xl); line-height: var(--lh-2xl); font-weight: var(--fw-semibold); }
  h4 { font-size: var(--fs-xl);  line-height: var(--lh-xl);  font-weight: var(--fw-semibold); }
  h5 { font-size: var(--fs-lg);  line-height: var(--lh-lg);  font-weight: var(--fw-medium); }
  h6 { font-size: var(--fs-base); line-height: var(--lh-base); font-weight: var(--fw-medium); }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); overflow: hidden;
    font-family: var(--font); font-size: var(--fs-base); line-height: var(--lh-base); font-weight: var(--fw-normal);
    -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; text-rendering: geometricPrecision; }
  #scene { display: block; width: 100vw; height: 100vh; }

  /* ===== SIDE PANEL ===== */
  :root { --panel-width: 240px; --line: rgba(0,0,0,0.12); }
  #panel { position: fixed; top: 0; left: 0; bottom: 0; width: var(--panel-width); box-sizing: border-box;
    padding: 24px 20px; background: var(--bg); border-right: 1px solid var(--line); overflow-y: auto; }
  #panel .title { font-size: var(--fs-sm); line-height: var(--lh-sm); font-weight: var(--fw-semibold);
    letter-spacing: 0.02em; margin-bottom: 32px; }
  #panel .section { font-size: var(--fs-xs); line-height: var(--lh-xs); font-weight: var(--fw-medium);
    letter-spacing: 0.08em; text-transform: uppercase; opacity: 0.5; margin-bottom: 8px; }
  .layer-row { display: flex; align-items: center; gap: 12px; width: 100%; padding: 8px 0; margin: 0;
    background: none; border: 0; border-bottom: 1px solid var(--line); color: var(--fg); cursor: pointer;
    font: inherit; font-size: var(--fs-sm); line-height: var(--lh-sm); text-align: left; }
  .layer-row .box { flex: none; width: 12px; height: 12px; box-sizing: border-box; border: 1px solid var(--fg);
    background: var(--fg); transition: background 0.15s; }
  .layer-row .name { flex: 1; font-weight: var(--fw-medium); transition: opacity 0.15s; }
  .layer-row .count { font-size: var(--fs-xs); opacity: 0.4; }
  .layer-row[aria-pressed="false"] .box { background: transparent; }
  .layer-row[aria-pressed="false"] .name { opacity: 0.35; }
  .layer-row:hover .name { text-decoration: underline; text-underline-offset: 3px; }
  .layer-row:focus-visible { outline: 1px solid var(--fg); outline-offset: 2px; }
  @media (max-width: 600px) { :root { --panel-width: 160px; } #panel { padding: 16px 12px; } }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
</head>
<body>
<aside id="panel">
  <div class="title">New Gen UI</div>
  <div class="section">Layers</div>
  <div id="layer-list"></div>
</aside>
<canvas id="scene"></canvas>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { LineSegments2 } from 'three/addons/lines/LineSegments2.js';
import { LineSegmentsGeometry } from 'three/addons/lines/LineSegmentsGeometry.js';
import { LineMaterial } from 'three/addons/lines/LineMaterial.js';

// ===== CONFIG: change these values =====
const CONFIG = {
  layerGap: 2.4,         // vertical distance between layers
  layerSize: 6,          // width/depth of each layer plane
  // Only two colours: white background, black ink. Everything else is transparency (0 = invisible, 1 = solid black).
  ink: 0x000000,         // the one colour for all interface elements
  layerOpacity: 0.03,    // fill of layer planes
  outlineOpacity: 0.35,  // outline of layer planes
  shapeOpacity: 0.08,    // faces of the shapes
  edgeOpacity: 1,        // edges of active shapes
  plannedOpacity: 0.3,   // edges of items that are planned, not active yet
  linkOpacity: 0.35,     // connections between items
  layerLabelOpacity: 0.85, // layer titles
  itemLabelOpacity: 0.7,   // shape names
  objectSize: 0.6,       // size of each shape
  linkCurve: 0.55,       // 0 = straight, higher = longer vertical ends
  linkSegments: 48,      // smoothness of each curve
  labelOffset: 0.5,      // gap between the edge of the layers and the layer titles
  // 3D labels use the typography above: a heading ('h1'..'h6') or { size: 'xs'..'9xl', weight }
  layerLabelType: 'h5',                                // layer titles
  itemLabelType:  { size: 'sm', weight: 'medium' },   // shape names
  textWorldScale: 0.018, // how big 1px of type is in the 3D scene
  autoRotateSpeed: 0.5,  // 0 = no auto rotation
  animDuration: 0.45,    // seconds for layers to move and fade when shown/hidden
  edgeWidth: 1,          // shape edge thickness in px
  hoverEdgeWidth: 2.5    // shape edge thickness in px on hover
};

// ===== DATA: layers bottom -> top. status: 'active' or 'planned' =====
const LAYERS = [
  { name: 'Project', shape: 'cube', items: [
    { id: 'docs',  name: 'Docs',         status: 'active' },
    { id: 'tasks', name: 'Tasks',        status: 'active' },
    { id: 'diag',  name: 'Diagrams',     status: 'active' },
    { id: 'ui3d',  name: '3D Interface', status: 'active' }
  ]},
  { name: 'People', shape: 'cylinder', items: [
    { id: 'artem', name: 'Artem', status: 'active' }
  ]},
  { name: 'Agents', shape: 'pyramid', items: [
    { id: 'claude',   name: 'Claude',         status: 'active' },
    { id: 'docskill', name: 'Doc Skill',      status: 'active' },
    { id: 'codeskill',name: 'Code Skill',     status: 'active' },
    { id: 'three',    name: 'Three.js Skill', status: 'active' },
    { id: 'cowork',   name: 'Cowork',         status: 'planned' }
  ]},
  { name: 'Services', shape: 'cube', items: [
    { id: 'notion', name: 'Notion', status: 'active' },
    { id: 'miro',   name: 'Miro',   status: 'active' },
    { id: 'github', name: 'GitHub', status: 'active' },
    { id: 'jira',   name: 'Jira',   status: 'planned' }
  ]}
];

// Links by id. Third value true = planned (dashed)
const LINKS = [
  ['artem', 'claude'],
  ['artem', 'ui3d'],
  ['claude', 'docskill'], ['claude', 'codeskill'], ['claude', 'three'],
  ['claude', 'notion'], ['claude', 'miro'],
  ['docskill', 'notion'], ['docskill', 'miro'],
  ['codeskill', 'github'],
  ['notion', 'docs'], ['notion', 'tasks'], ['miro', 'diag'],
  ['github', 'ui3d'], ['three', 'ui3d'],
  ['cowork', 'notion', true], ['artem', 'cowork', true]
];

// ===== RENDERING =====
const canvas = document.getElementById('scene');
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(50, innerWidth / innerHeight, 0.1, 100);
camera.position.set(10, 8, 10);
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setClearColor(0xffffff, 1);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, CONFIG.layerGap * 1.5, 0);
controls.enableDamping = true;
controls.autoRotate = CONFIG.autoRotateSpeed > 0;
controls.autoRotateSpeed = CONFIG.autoRotateSpeed;

const HALF = {
  cube: CONFIG.objectSize * 0.5,
  pyramid: CONFIG.objectSize * 0.6,
  cylinder: CONFIG.objectSize * 0.65
};

// Every material remembers its normal opacity, so layers can fade in and out
function fadeable(mat, opacity) { mat.transparent = true; mat.opacity = opacity; mat.userData.base = opacity; return mat; }

const edgeMaterials = []; // fat-line materials need the screen size
function makeShape(shape, planned) {
  const s = CONFIG.objectSize;
  let geo;
  if (shape === 'cube') geo = new THREE.BoxGeometry(s, s, s);
  else if (shape === 'pyramid') { geo = new THREE.ConeGeometry(s * 0.75, s * 1.2, 4); geo.rotateY(Math.PI / 4); }
  else geo = new THREE.CylinderGeometry(s * 0.4, s * 0.4, s * 1.3, 32);
  const group = new THREE.Group();
  const face = new THREE.Mesh(geo, fadeable(new THREE.MeshBasicMaterial({
    color: CONFIG.ink, depthWrite: false, side: THREE.DoubleSide
  }), planned ? CONFIG.shapeOpacity * 0.4 : CONFIG.shapeOpacity));
  group.add(face);
  const edgeMat = fadeable(new LineMaterial({ color: CONFIG.ink, linewidth: CONFIG.edgeWidth }),
    planned ? CONFIG.plannedOpacity : CONFIG.edgeOpacity);
  edgeMaterials.push(edgeMat);
  const edges = new LineSegments2(new LineSegmentsGeometry().fromEdgesGeometry(new THREE.EdgesGeometry(geo, 20)), edgeMat);
  group.add(edges);
  return { group, face, edgeMat };
}

// Read type tokens from the CSS above, so HTML and 3D share one scale
const css = getComputedStyle(document.documentElement);
const token = name => css.getPropertyValue(name).trim();
const FONT = token('--font');
function typeStyle(t) {
  if (typeof t === 'string') t = { size: token(`--${t}-size`), weight: token(`--${t}-weight`) };
  return { size: parseFloat(token('--fs-' + t.size)), line: parseFloat(token('--lh-' + t.size)), weight: token('--fw-' + t.weight) };
}
// Make sure the font is ready before labels are drawn
await Promise.all(['300', '400', '500', '600', '700'].map(w => document.fonts.load(`${w} 16px ${FONT}`)));

const TEXT_RES = 4; // draw labels at 4x for sharp edges
function textSprite(text, type, align, opacity) {
  const t = typeStyle(type);
  const font = `${t.weight} ${t.size * TEXT_RES}px ${FONT}`;
  const c = document.createElement('canvas');
  const ctx = c.getContext('2d');
  ctx.font = font;
  c.width = Math.ceil(ctx.measureText(text).width) + 8;
  c.height = Math.ceil(t.line * TEXT_RES);
  ctx.font = font;
  ctx.fillStyle = '#000000';
  ctx.textBaseline = 'middle';
  ctx.fillText(text, 4, c.height / 2);
  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.anisotropy = renderer.capabilities.getMaxAnisotropy();
  const sprite = new THREE.Sprite(fadeable(new THREE.SpriteMaterial({ map: tex, depthTest: false }), opacity));
  const k = CONFIG.textWorldScale / TEXT_RES;
  sprite.scale.set(c.width * k, c.height * k, 1);
  if (align === 'right') sprite.center.set(1, 0.5);
  sprite.renderOrder = 10;
  return sprite;
}

// ===== BUILD THE LAYERS =====
// Each layer is a group that can move up/down and fade. Positions inside a layer are local (y = 0 is the plane).
const nodes = {};
const layerGroups = [];
const shapes = []; // everything you can hover or click
LAYERS.forEach((layer, li) => {
  const group = new THREE.Group();
  group.position.y = li * CONFIG.layerGap;
  group.userData = { alpha: 1, targetAlpha: 1, targetY: group.position.y };
  scene.add(group);
  layerGroups.push(group);

  const planeGeo = new THREE.PlaneGeometry(CONFIG.layerSize, CONFIG.layerSize);
  planeGeo.rotateX(-Math.PI / 2);
  group.add(new THREE.Mesh(planeGeo, fadeable(new THREE.MeshBasicMaterial({
    color: CONFIG.ink, side: THREE.DoubleSide, depthWrite: false }), CONFIG.layerOpacity)));
  group.add(new THREE.LineSegments(new THREE.EdgesGeometry(planeGeo),
    fadeable(new THREE.LineBasicMaterial({ color: CONFIG.ink }), CONFIG.outlineOpacity)));

  const label = textSprite(layer.name, CONFIG.layerLabelType, 'right', CONFIG.layerLabelOpacity);
  group.add(label);
  group.userData.label = label;

  const n = layer.items.length;
  layer.items.forEach((item, ii) => {
    const angle = (ii / n) * Math.PI * 2 + li * 0.6;
    const r = n === 1 ? 0 : CONFIG.layerSize * 0.3;
    const planned = item.status === 'planned';
    const pos = new THREE.Vector3(Math.cos(angle) * r, CONFIG.objectSize * 0.6, Math.sin(angle) * r);
    const shape = makeShape(layer.shape, planned);
    shape.group.position.copy(pos);
    group.add(shape.group);

    const tag = textSprite(item.name + (planned ? ' (planned)' : ''), CONFIG.itemLabelType, 'center',
      planned ? CONFIG.itemLabelOpacity * 0.6 : CONFIG.itemLabelOpacity);
    tag.position.copy(pos).add(new THREE.Vector3(0, HALF[layer.shape] + 0.3, 0));
    group.add(tag);

    shape.face.userData.shape = { item, layer, layerIndex: li, edgeMat: shape.edgeMat, tag };
    shapes.push(shape.face);
    nodes[item.id] = { pos, half: HALF[layer.shape], layer: li };
  });
});

// ===== LINKS: vertical where they meet each shape, smooth S-curve between =====
const linkLines = [];
LINKS.forEach(([a, b, planned]) => {
  if (!nodes[a] || !nodes[b]) return;
  const mat = planned
    ? new THREE.LineDashedMaterial({ color: CONFIG.ink, dashSize: 0.15, gapSize: 0.12 })
    : new THREE.LineBasicMaterial({ color: CONFIG.ink });
  fadeable(mat, CONFIG.linkOpacity);
  const line = new THREE.Line(new THREE.BufferGeometry(), mat);
  line.userData = { a: nodes[a], b: nodes[b], planned };
  scene.add(line);
  linkLines.push(line);
});

const _s = new THREE.Vector3(), _e = new THREE.Vector3();
function worldPos(node, out) { return out.copy(node.pos).setY(node.pos.y + layerGroups[node.layer].position.y); }
function updateLinks() {
  linkLines.forEach(line => {
    let { a: A, b: B, planned } = line.userData;
    if (worldPos(A, _s).y > worldPos(B, _e).y) [A, B] = [B, A];
    const start = worldPos(A, new THREE.Vector3()).add(new THREE.Vector3(0, A.half, 0));
    const end   = worldPos(B, new THREE.Vector3()).sub(new THREE.Vector3(0, B.half, 0));
    const k = (end.y - start.y) * CONFIG.linkCurve;
    const curve = new THREE.CubicBezierCurve3(start, start.clone().add(new THREE.Vector3(0, k, 0)),
      end.clone().sub(new THREE.Vector3(0, k, 0)), end);
    line.geometry.setFromPoints(curve.getPoints(CONFIG.linkSegments));
    if (planned) line.computeLineDistances();
  });
}

// ===== LAYER SWITCHER (side panel) =====
const STORAGE_KEY = 'ngui.hiddenLayers';
let hidden = new Set();
try { hidden = new Set(JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]')); } catch (e) {}

// Visible layers stack with no gaps. A hidden layer fades out where the gap closes.
function applyVisibility() {
  let slot = 0;
  LAYERS.forEach((layer, li) => {
    const d = layerGroups[li].userData;
    const isVisible = !hidden.has(layer.name);
    d.targetAlpha = isVisible ? 1 : 0;
    d.targetY = Math.max(slot - (isVisible ? 0 : 0.5), 0) * CONFIG.layerGap;
    if (isVisible) slot++;
  });
  stackHeight = Math.max(slot - 1, 0) * CONFIG.layerGap;
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify([...hidden])); } catch (e) {}
}
let stackHeight = 0;

const list = document.getElementById('layer-list');
[...LAYERS].reverse().forEach(layer => { // top layer first, same order as in 3D
  const row = document.createElement('button');
  row.className = 'layer-row';
  row.innerHTML = `<span class="box"></span><span class="name"></span><span class="count"></span>`;
  row.querySelector('.name').textContent = layer.name;
  row.querySelector('.count').textContent = layer.items.length;
  row.setAttribute('aria-pressed', String(!hidden.has(layer.name)));
  row.addEventListener('click', () => {
    hidden.has(layer.name) ? hidden.delete(layer.name) : hidden.add(layer.name);
    row.setAttribute('aria-pressed', String(!hidden.has(layer.name)));
    applyVisibility();
  });
  list.appendChild(row);
});
applyVisibility();
// Start already in place (no animation on page load)
layerGroups.forEach(g => { g.position.y = g.userData.targetY; g.userData.alpha = g.userData.targetAlpha; });
controls.target.y = stackHeight / 2;
camera.position.y += stackHeight / 2 - CONFIG.layerGap * 1.5;

// ===== HOVER AND CLICK ON SHAPES =====
const raycaster = new THREE.Raycaster();
const pointer = new THREE.Vector2();
let hovered = null;    // the shape under the mouse
let pointerIn = false;
renderer.domElement.addEventListener('pointermove', e => {
  pointer.set(e.clientX / innerWidth * 2 - 1, -(e.clientY / innerHeight) * 2 + 1);
  pointerIn = true;
});
renderer.domElement.addEventListener('pointerleave', () => { pointerIn = false; });

function updateHover() {
  let hit = null;
  if (pointerIn) {
    raycaster.setFromCamera(pointer, camera);
    const targets = shapes.filter(f => layerGroups[f.userData.shape.layerIndex].userData.targetAlpha > 0);
    const hits = raycaster.intersectObjects(targets, false);
    hit = hits.length ? hits[0].object : null;
  }
  if (hit === hovered) return;
  hovered = hit;
  renderer.domElement.style.cursor = hovered ? 'pointer' : '';
  controls.autoRotate = !hovered && CONFIG.autoRotateSpeed > 0; // hold still while pointing at a shape
}

// Click-through: every shape click lands here. Add actions per item later (open Notion page, Miro board...).
function onShapeClick(info) {
  window.dispatchEvent(new CustomEvent('shape-click', { detail: { id: info.item.id, name: info.item.name, layer: info.layer.name } }));
}
let downAt = null;
renderer.domElement.addEventListener('pointerdown', e => { downAt = [e.clientX, e.clientY]; });
renderer.domElement.addEventListener('pointerup', e => {
  // Only a click, not the end of a drag-to-rotate
  if (downAt && Math.hypot(e.clientX - downAt[0], e.clientY - downAt[1]) < 5 && hovered) onShapeClick(hovered.userData.shape);
  downAt = null;
});

// ===== EACH FRAME =====
// Layer titles stay on the screen-left side of the column
const right = new THREE.Vector3();
function placeLayerLabels() {
  right.setFromMatrixColumn(camera.matrixWorld, 0);
  right.y = 0; right.normalize();
  // Start just past the edge of the layer plane as seen from the camera, then add the gap
  const edge = CONFIG.layerSize / 2 * (Math.abs(right.x) + Math.abs(right.z));
  const dist = edge + CONFIG.labelOffset;
  layerGroups.forEach(g => g.userData.label.position.set(-right.x * dist, CONFIG.objectSize * 0.6, -right.z * dist));
}

// Smoothly move layers, fade them, and keep the camera on the middle of the stack
const ease = (from, to, k) => from + (to - from) * k;
function updateLayers(dt) {
  const k = 1 - Math.exp(-dt * 6 / CONFIG.animDuration); // ~done within animDuration
  let moving = false;
  layerGroups.forEach(g => {
    const d = g.userData;
    if (Math.abs(g.position.y - d.targetY) > 1e-4 || Math.abs(d.alpha - d.targetAlpha) > 1e-3) moving = true;
    g.position.y = ease(g.position.y, d.targetY, k);
    d.alpha = ease(d.alpha, d.targetAlpha, k);
    g.visible = d.alpha > 0.01;
  });
  const dy = ease(controls.target.y, stackHeight / 2, k) - controls.target.y;
  controls.target.y += dy; camera.position.y += dy;
  return moving;
}

// Opacity = normal opacity x layer fade. Hovered shape: solid, bolder edges and a solid name.
function updateOpacity() {
  layerGroups.forEach(g => {
    const a = g.userData.alpha;
    g.traverse(o => { if (o.material) o.material.opacity = o.material.userData.base * a; });
  });
  if (hovered) {
    const { edgeMat, tag, layerIndex } = hovered.userData.shape;
    const a = layerGroups[layerIndex].userData.alpha;
    edgeMat.opacity = a; tag.material.opacity = a;
  }
  edgeMaterials.forEach(m => { m.linewidth = hovered && m === hovered.userData.shape.edgeMat ? CONFIG.hoverEdgeWidth : CONFIG.edgeWidth; });
  linkLines.forEach(l => {
    const a = Math.min(layerGroups[l.userData.a.layer].userData.alpha, layerGroups[l.userData.b.layer].userData.alpha);
    l.material.opacity = l.material.userData.base * a;
    l.visible = a > 0.01;
  });
}

// Keep the 3D structure centred in the space to the right of the panel
function fitView() {
  const panelW = document.getElementById('panel').offsetWidth;
  camera.aspect = innerWidth / innerHeight;
  camera.setViewOffset(innerWidth, innerHeight, -panelW / 2, 0, innerWidth, innerHeight);
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  edgeMaterials.forEach(m => m.resolution.set(innerWidth, innerHeight));
}
addEventListener('resize', fitView);
fitView();

updateLinks();
const clock = new THREE.Clock();
function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.1);
  if (updateLayers(dt)) updateLinks();
  controls.update();
  placeLayerLabels();
  updateHover();
  updateOpacity();
  renderer.render(scene, camera);
}
animate();
</script>
</body>
</html>
